name: Dashboard Prices

on:
  schedule:
    # GitHub 스케줄은 정각·인기 시각에 수 시간 지연되므로 어긋난 분으로 잡고, 국장은 마감 후 여러 번 수집
    - cron: '17 21 * * *'    # 06:17 KST (미장 마감)
    - cron: '47 6 * * 1-5'   # 15:47 KST (국장 마감 직후)
    - cron: '37 8 * * 1-5'   # 17:37 KST
    - cron: '17 10 * * 1-5'  # 19:17 KST
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install yfinance requests
      - name: Fetch prices and push to Gist
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          MY_GIST_ID: ${{ secrets.MY_GIST_ID }}
        run: python dashboard_prices.py
