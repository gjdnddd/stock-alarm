<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stock Alarm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  </style>
</head>
<body class="bg-[#0f172a] text-white min-h-screen font-sans">
  <div class="p-4 max-w-2xl mx-auto">

    <!-- 헤더 -->
    <div class="flex items-center justify-between mb-2">
      <h1 class="text-lg font-bold flex items-center gap-2">
        <span class="text-emerald-400">📈</span> Stock Alarm
      </h1>
      <div class="flex gap-2">
        <button onclick="refreshAll()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-bold shadow-lg transition-all active:scale-95">새로고침</button>
        <button onclick="toggleSettings()" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">⚙️</button>
      </div>
    </div>

    <p id="status-msg" class="text-[11px] text-slate-300 mb-4 h-4 flex items-center gap-1"></p>

    <!-- 설정 패널 -->
    <div id="settings-panel" class="hidden mb-6 bg-slate-800 rounded-2xl p-5 shadow-2xl border border-slate-700/50">
      <div class="space-y-2">
        <h2 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">API & Gist 설정</h2>
        <input id="inp-gist-id" type="text" placeholder="Gist ID"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">
        <input id="inp-token" type="password" placeholder="GitHub Token"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">
        <input id="inp-finnhub" type="password" placeholder="Finnhub API Key (선택)"
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">
        <div class="grid grid-cols-2 gap-2 pt-1">
          <input id="m-qqq-p" type="number" step="0.01" placeholder="QQQ 수동가격"
                 class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-sm outline-none">
          <input id="m-soxx-p" type="number" step="0.01" placeholder="SOXX 수동가격"
                 class="bg-slate-900 border border-slate-700 rounded-lg px-2 py-2 text-sm outline-none">
        </div>
        <div class="flex gap-2 pt-1">
          <button onclick="saveSettings()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 rounded-xl text-sm font-bold">설정 저장</button>
          <button onclick="applyManual()" class="flex-1 py-2 bg-orange-600 hover:bg-orange-500 rounded-xl text-sm font-bold">수동 적용</button>
        </div>
      </div>
    </div>

    <!-- 카드 영역 -->
    <div id="card-QQQ"></div>
    <div id="card-SOXX"></div>

  </div>

  <script>
    // ── 상수 ───────────────────────────────────────────────────────

    const STRATEGY = {
      QQQ:  { infiLimit: -3, sellUnlock: 90, sell1stDrop: -5,  sell2ndDrop: -10, buyEnter: -15, buyNear: -10 },
      SOXX: { infiLimit: -4, sellUnlock: 80, sellDrop:   -10,  sellDays:      5 }
    };

    // 하드 2단계: near1(1단계 근접, 없으면 null) / enter1 / near2 / enter2  (main.py와 동일)
    const HARD_LEVELS = {
      QQQ:  { near1: -20,  enter1: -25, near2: -30, enter2: -35 },
      SOXX: { near1: null, enter1: -30, near2: -35, enter2: -40 }
    };
    const HARD_RATIO_1 = '평가금 1/4';
    const HARD_RATIO_2 = '평가금 100%';

    const SOXX_BUY_LEVELS = [[-20,'1차'],[-22,'2차'],[-25,'3차']];
    const hardLevelList = cfg => [[cfg.enter1, '1단계'], [cfg.enter2, '2단계']];
    // 레버리지 ETF(TQQQ/SOXL) 추정 배율 — 3배를 정확히 추종하지 않으므로 2.9 (main.py ETF_LEVERAGE와 동일)
    const ETF_LEVERAGE = 2.9;
    const ETF_OF = { QQQ: 'TQQQ', SOXX: 'SOXL' };

    function etfEstimate(level, ath, cp, etfPrice) {
      if (!etfPrice || etfPrice <= 0 || !cp || cp <= 0) return null;
      const target = ath * (1 + level / 100);
      const move   = target / cp - 1;
      const est    = etfPrice * (1 + ETF_LEVERAGE * move);
      return est > 0 ? est : null;   // 큰 괴리에서 선형식이 0 이하로 깨지면 생략
    }

    function fmtEtfLevel(label, level, ath, cp, etfName, etfPrice) {
      const abs = ath * (1 + level / 100);
      const est = etfEstimate(level, ath, cp, etfPrice);
      const etfPart = est !== null ? `(${etfName} $${est.toFixed(2)})` : '';
      return `${label} ${level}% $${abs.toFixed(2)}${etfPart}`;
    }

    // ── 분할(스플릿) 처리 ──────────────────────────────────────────
    // main.py와 동일 기준. 저장된 절대가는 자동 수정하지 않고, 사용자가 '분할 보정 적용'을 눌러야 반영된다.
    const SPLIT_JUMP_LOW = 0.6, SPLIT_JUMP_HIGH = 1.7, SPLIT_WINDOW = 40;
    const SPLIT_FIELDS = { infi_hae: '무매 HAE', cycle_low: '사이클 저점', sell_ath: '매도 ATH' };

    function roundSplitRatio(r) {
      if (r >= 1) return Math.max(Math.round(r * 2) / 2, 1);
      const inv = Math.round((1 / r) * 2) / 2;
      return inv > 0 ? 1 / inv : r;
    }

    // pairs: [[YYYY-MM-DD, 종가], ...]  최근 구간에서 분할로 보이는 불연속(가장 최근 1건)
    function findPriceJump(pairs) {
      const s = pairs.slice(-(SPLIT_WINDOW + 1));
      let found = null;
      for (let i = 1; i < s.length; i++) {
        const r = s[i][1] / s[i - 1][1];
        if (r <= SPLIT_JUMP_LOW || r >= SPLIT_JUMP_HIGH)
          found = { date: s[i][0], ratio: roundSplitRatio(s[i - 1][1] / s[i][1]) };
      }
      return found;
    }

    // 실시간 현재가가 마지막 종가 대비 범위를 벗어나면(분할 첫날 장중 등) 불연속으로 본다
    function jumpFromCurrent(current, lastClose) {
      if (!current || !lastClose) return null;
      const r = current / lastClose;
      if (r > SPLIT_JUMP_LOW && r < SPLIT_JUMP_HIGH) return null;
      return { date: new Date().toISOString().split('T')[0], ratio: roundSplitRatio(lastClose / current) };
    }

    // ── 상태 ───────────────────────────────────────────────────────

    let stockData = null;
    let prices = {
      QQQ:  { current: 0, ath: 0, closeDate: null, marketState: null, jump: null },
      SOXX: { current: 0, ath: 0, closeDate: null, marketState: null, jump: null },
      SOXL: { current: 0, ath: 0, closeDate: null, marketState: null, jump: null },
      TQQQ: { current: 0, ath: 0, closeDate: null, marketState: null, jump: null }
    };

    // ── 유틸 ───────────────────────────────────────────────────────

    const getConfig = () => ({
      gistId:  localStorage.getItem('gist_id')       || '',
      token:   localStorage.getItem('gist_token')    || '',
      finnhub: localStorage.getItem('finnhub_token') || ''
    });

    const setStatus = msg => {
      const el = document.getElementById('status-msg');
      el.innerHTML = msg ? `<span>●</span> ${msg}` : '';
    };

    const now = () => new Date().toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

    // ── API: 가격 ──────────────────────────────────────────────────

    async function fetchYahoo(ticker) {
      const base  = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=5y`;
      const proxy = `https://corsproxy.io/?${encodeURIComponent(base)}`;
      try {
        const r   = await fetch(proxy);
        const j   = await r.json();
        const res = j.chart?.result?.[0];
        const current = res?.meta?.regularMarketPrice;
        if (!current || current <= 0) return null;
        const rawCloses = res?.indicators?.quote?.[0]?.close || [];
        const closes  = rawCloses.filter(c => c != null);
        const ath     = closes.length ? Math.max(...closes) : 0;
        const timestamps = res?.timestamp || [];
        const lastTs  = timestamps.length ? timestamps[timestamps.length - 1] : null;
        const closeDate   = lastTs ? new Date(lastTs * 1000).toISOString().split('T')[0] : null;
        const marketState = res?.meta?.marketState || null;
        const pairs = [];
        timestamps.forEach((ts, i) => {
          if (rawCloses[i] != null) pairs.push([new Date(ts * 1000).toISOString().split('T')[0], rawCloses[i]]);
        });
        const lastClose = pairs.length ? pairs[pairs.length - 1][1] : null;
        const jump = findPriceJump(pairs) || jumpFromCurrent(current, lastClose);
        return { current, ath: Math.max(ath, current), closeDate, marketState, lastClose, jump };
      } catch { return null; }
    }

    async function fetchPrice(ticker) {
      const yahoo = await fetchYahoo(ticker);
      const key   = getConfig().finnhub;
      if (key) {
        try {
          const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${ticker}&token=${key}`, { cache: 'no-store' });
          const q   = await res.json();
          const current = q.c > 0 ? q.c : q.pc;
          if (current) return {
            current,
            ath:         Math.max(yahoo?.ath || 0, current),
            closeDate:   yahoo?.closeDate   || null,
            marketState: yahoo?.marketState || null,
            lastClose:   yahoo?.lastClose   || null,
            jump:        yahoo?.jump || jumpFromCurrent(current, yahoo?.lastClose)
          };
        } catch {}
      }
      return yahoo;
    }

    // ── API: Gist ──────────────────────────────────────────────────

    async function fetchGistData() {
      const { gistId, token } = getConfig();
      if (!gistId || !token) return false;
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: { Authorization: `token ${token}` }, cache: 'no-store'
        });
        const j   = await res.json();
        const raw = j.files?.['stock_data.json']?.content;
        if (raw) { stockData = JSON.parse(raw); return true; }
      } catch { setStatus('Gist 로드 실패'); }
      return false;
    }

    async function saveToGist() {
      const { gistId, token } = getConfig();
      if (!gistId || !token || !stockData) return false;
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          method:  'PATCH',
          headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
          body:    JSON.stringify({ files: { 'stock_data.json': { content: JSON.stringify(stockData, null, 2) } } })
        });
        return res.ok;
      } catch { return false; }
    }

    // ── 전략 판정 (순수 함수) ──────────────────────────────────────

    function getBuyStatus(ticker, drop, ath, cp, etfPrice) {
      const etfName = ETF_OF[ticker];
      if (ticker === 'QQQ') {
        const { buyEnter, buyNear } = STRATEGY.QQQ;
        const detail = fmtEtfLevel('매수', buyEnter, ath, cp, etfName, etfPrice);
        if (drop <= buyEnter) return { label: '🚨 매수 타점 도달', cls: 'text-red-400 font-bold', sub: `현재 ${drop.toFixed(1)}% | ${detail}` };
        if (drop <= buyNear)  return { label: '⚠️ 근접',          cls: 'text-yellow-400',         sub: `현재 ${drop.toFixed(1)}% | ${detail}` };
        return                       { label: '✅ 대기',           cls: 'text-slate-300',           sub: `현재 ${drop.toFixed(1)}% | ${detail}` };
      }
      const detail  = SOXX_BUY_LEVELS.map(([thr, lbl]) => fmtEtfLevel(lbl, thr, ath, cp, etfName, etfPrice)).join(' / ');
      const reached = SOXX_BUY_LEVELS.filter(([thr]) => drop <= thr).map(([, lbl]) => lbl);
      if (reached.length)
        return { label: `🚨 ${reached.join('+')} 도달`, cls: 'text-red-400 font-bold', sub: `현재 ${drop.toFixed(1)}% | ${detail}` };
      if (drop <= -15)
        return { label: '⚠️ 근접', cls: 'text-yellow-400', sub: `현재 ${drop.toFixed(1)}% | ${detail}` };
      return { label: '✅ 대기', cls: 'text-slate-300', sub: `현재 ${drop.toFixed(1)}% | ${detail}` };
    }

    function getHardStatus(ticker, drop, ath, cp, etfPrice) {
      const cfg = HARD_LEVELS[ticker === 'QQQ' ? 'QQQ' : 'SOXX'];
      const { icon, text } = hardStatus(cfg, drop);
      const cls = icon === '💀' ? 'text-red-400 font-black' : icon === '⚠️' ? 'text-orange-400' : 'text-slate-300';
      const label = icon === '✅' ? '✅ 대기' : `${icon} ${text}`;
      const levels = hardLevelList(cfg);
      const sub = `현재 ${drop.toFixed(1)}% | ${levels.map(([thr, lbl]) => fmtEtfLevel(lbl, thr, ath, cp, ETF_OF[ticker], etfPrice)).join(' / ')}`;
      return { label, cls, sub };
    }

    // main.py hard_status와 동일 판정/문구
    function hardStatus(cfg, drop) {
      if (drop <= cfg.enter2) return { icon: '💀', text: `하드 2단계 진입 (${HARD_RATIO_2})` };
      if (drop <= cfg.near2)  return { icon: '💀', text: `하드 1단계 진입 (${HARD_RATIO_1}) / 2단계 근접 (다음 ${HARD_RATIO_2})` };
      if (drop <= cfg.enter1) return { icon: '💀', text: `하드 1단계 진입 (${HARD_RATIO_1})` };
      if (cfg.near1 !== null && drop <= cfg.near1) return { icon: '⚠️', text: `하드 1단계 근접 (다음 ${HARD_RATIO_1})` };
      return { icon: '✅', text: '하드 대기' };
    }

    function getInfiStatus(ticker, data, cp) {
      const hae = data?.infi_hae || 0;
      if (hae <= 0) return { label: '⏸ HAE 없음', cls: 'text-slate-300', sub: 'HAE 입력 후 활성화' };
      const drop  = (cp / hae - 1) * 100;
      const limit = STRATEGY[ticker].infiLimit;
      const near  = limit + 1;
      const limitAbs = hae * (1 + limit / 100);
      const nearAbs  = hae * (1 + near / 100);
      if (drop <= limit) return { label: '🔴 즉시매수!', cls: 'text-red-400 font-bold', sub: `HAE $${hae.toFixed(2)} / 현재 ${drop.toFixed(1)}% / 기준 ${limit}%($${limitAbs.toFixed(2)})` };
      if (drop <= near)  return { label: '🟡 근접',      cls: 'text-yellow-400',         sub: `HAE $${hae.toFixed(2)} / 현재 ${drop.toFixed(1)}% / 기준 ${near}%($${nearAbs.toFixed(2)})` };
      return               { label: '✅ 대기',           cls: 'text-slate-300',           sub: `HAE $${hae.toFixed(2)} / 현재 ${drop.toFixed(1)}% / 기준 ${limit}%($${limitAbs.toFixed(2)})` };
    }

    function makePips(consec, max, color) {
      return Array.from({ length: max }, (_, i) =>
        `<span style="font-size:14px;line-height:1;color:${i < consec ? color : '#475569'}">●</span>`
      ).join('');
    }

    function getSellStatus(ticker, data, drop, gain, ath, cycleLow) {
      const unlock = STRATEGY[ticker].sellUnlock;
      if (gain === null) return { label: '⏸ 사이클 없음', cls: 'text-slate-300', sub: '사이클 시작 후 활성화' };

      const unlockAbs = cycleLow ? `($${(cycleLow * (1 + unlock / 100)).toFixed(2)})` : '';
      const unlocked = data?.sell_unlocked || gain >= unlock;
      if (!unlocked) {
        if (gain >= unlock - 5)
          return { label: '🔔 잠금 해제 근접', cls: 'text-blue-400', sub: `저점 대비 +${gain.toFixed(1)}% / 기준 +${unlock}%${unlockAbs}` };
        return   { label: '🔒 감시 비활성',   cls: 'text-slate-300', sub: `저점 대비 +${gain.toFixed(1)}% / 기준 +${unlock}%${unlockAbs}` };
      }

      if (ticker === 'QQQ') {
        const done1 = data?.sell_1st_done;
        const sell1Abs = (ath * 0.95).toFixed(2);
        if (!done1) {
          if (drop <= STRATEGY.QQQ.sell1stDrop)
            return { label: '💰 1차 매도!',     cls: 'text-orange-400 font-bold', sub: `ATH 대비 ${drop.toFixed(1)}% (기준 -5%, $${sell1Abs}) → TQQQ 50% 매도` };
          return   { label: '👁 1차 매도 감시 중', cls: 'text-green-400',           sub: `ATH 대비 ${drop.toFixed(1)}% / 기준 -5%($${sell1Abs})` };
        }
        const sell2Abs = (ath * (1 + STRATEGY.QQQ.sell2ndDrop / 100)).toFixed(2);
        if (data?.sell_2nd_done)
          return { label: '💰 2차 매도!',      cls: 'text-orange-400 font-bold', sub: `ATH ${STRATEGY.QQQ.sell2ndDrop}%($${sell2Abs}) → 잔여 전량 매도` };
        return   { label: '👁 2차 매도 감시 중', cls: 'text-green-400',            sub: `ATH 대비 ${drop.toFixed(1)}% / 기준 ${STRATEGY.QQQ.sell2ndDrop}%($${sell2Abs})` };
      } else {
        const { sellDays } = STRATEGY.SOXX;
        const consec   = data?.soxx_consecutive || 0;
        const pipColor = consec >= sellDays ? '#f97316' : consec >= 3 ? '#facc15' : '#4ade80';
        const pips     = consec > 0 ? makePips(consec, sellDays, pipColor) : '';
        const hardAbs  = (ath * 0.90).toFixed(2);
        if (consec >= sellDays)
          return { label: '💰 매도!',          cls: 'text-orange-400 font-bold', sub: `ATH -10%($${hardAbs}) 5거래일 연속 → 전량 매도`, pips };
        if (consec >= 3)
          return { label: `⚠️ ${consec}/5일`, cls: 'text-yellow-400 font-bold', sub: `${sellDays - consec}거래일 남음 / ATH 대비 ${drop.toFixed(1)}% / 기준 -10%($${hardAbs})`, pips };
        if (consec > 0)
          return { label: `👁 ${consec}/5일`, cls: 'text-green-400',            sub: `ATH 대비 ${drop.toFixed(1)}% / 기준 -10%($${hardAbs})`, pips };
        return   { label: '👁 감시 중',        cls: 'text-green-400',            sub: `ATH 대비 ${drop.toFixed(1)}% / 기준 -10%($${hardAbs}) × 5일` };
      }
    }

    // ── 분할 상태 ──────────────────────────────────────────────────
    // 'pending' = 사용자 확정 필요 / 'lag' = 확정은 했지만 Yahoo 과거 데이터가 아직 분할 미반영 / null = 정상

    function splitState(ticker) {
      const d = stockData?.[ticker] || {};
      if (d.pending_split) return { kind: 'pending', info: d.pending_split };
      let jump = prices[ticker]?.jump;
      if (jump && jump.date <= (d.split_dismissed || '')) jump = null;
      if (!jump) return null;
      if (jump.date > (d.split_checked || ''))
        return { kind: 'pending', info: { date: jump.date, ratio: jump.ratio, source: 'price_jump' } };
      return { kind: 'lag', info: jump };
    }

    function splitBanner(ticker) {
      const st = splitState(ticker);
      if (!st) return '';
      if (st.kind === 'lag')
        return `<div class="mb-3 p-3 rounded-xl bg-yellow-500/10 border border-yellow-500/30 text-[11px] text-yellow-300">⏳ 분할 보정은 완료됐지만 Yahoo 과거 데이터가 아직 조정되지 않았습니다 (${st.info.date}). 상태 판정·자동 갱신을 보류 중이며, 조정되면 자동으로 재개됩니다.</div>`;
      const i   = st.info;
      const why = i.source === 'yfinance' ? '분할 이벤트 감지' : '가격 불연속 감지 (비율 추정)';
      return `<div class="mb-3 p-3 rounded-xl bg-orange-500/10 border border-orange-500/40 text-[11px] text-orange-200 space-y-2">
        <div class="font-bold text-[12px]">⚠️ ${ticker} 분할 의심 — ${why} (${i.date})</div>
        <div>저장된 ${Object.values(SPLIT_FIELDS).join('·')}을(를) 분할 비율로 나눠야 합니다. 확정 전까지 상태 판정과 자동 갱신(ATH·매도 카운트)을 보류합니다.</div>
        <div class="flex items-center gap-2">
          <input id="split-ratio-${ticker}" type="number" step="0.01" value="${i.ratio}"
                 class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-sm outline-none text-white">
          <span>: 1</span>
          <button onclick="applySplit('${ticker}')" class="flex-1 py-1.5 bg-orange-600 hover:bg-orange-500 rounded-lg text-xs font-bold text-white active:scale-95">분할 보정 적용</button>
          <button onclick="dismissSplit('${ticker}')" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-white">분할 아님</button>
        </div>
      </div>`;
    }

    // ── 카운팅 ─────────────────────────────────────────────────────

    async function updateSoxxCount() {
      if (!stockData?.SOXX) return null;
      if (splitState('SOXX')) return null;   // 분할 보정 대기 중에는 카운트·저장 보류
      const t = stockData.SOXX;

      const cycleLow = t.cycle_low;
      const gain     = cycleLow ? (prices.SOXX.current / cycleLow - 1) * 100 : null;
      const unlocked = t.sell_unlocked || (gain !== null && gain >= STRATEGY.SOXX.sellUnlock);
      if (!unlocked) return null;

      const closeDate = prices.SOXX.closeDate;
      if (!closeDate || closeDate === t.soxx_last_date) return null;

      const sellAth = t.sell_ath || prices.SOXX.ath;
      if (sellAth <= 0) return null;

      if (prices.SOXX.marketState === 'REGULAR') return null; // 장중 → Gist 저장 보류

      const drop      = (prices.SOXX.current / sellAth - 1) * 100;
      const prevConsec = t.soxx_consecutive || 0;
      const newConsec  = Math.min(drop <= STRATEGY.SOXX.sellDrop ? prevConsec + 1 : 0, STRATEGY.SOXX.sellDays);

      t.soxx_consecutive = newConsec;
      t.soxx_last_date   = closeDate;
      await saveToGist();
      return newConsec;
    }

    // ── 렌더링 ─────────────────────────────────────────────────────

    function statusRow(name, s) {
      return `<div class="flex items-center justify-between bg-slate-700/20 p-3 rounded-xl border border-white/5">
        <div>
          <div class="text-[11px] text-slate-300">${name}</div>
          <div class="text-[10px] text-slate-300 mt-0.5">${s.sub}</div>
        </div>
        <div class="text-right">
          ${s.pips ? `<div class="flex justify-end gap-0.5 mb-1">${s.pips}</div>` : ''}
          <div class="${s.cls} text-sm">${s.label}</div>
        </div>
      </div>`;
    }

    function renderCard(ticker) {
      const etf  = ticker === 'QQQ' ? 'TQQQ' : 'SOXL';
      const cp   = prices[ticker].current;
      const data = stockData?.[ticker] || {};
      const ath  = (data?.sell_ath > 0) ? data.sell_ath : prices[ticker].ath;
      const drop = ath > 0 ? (cp / ath - 1) * 100 : 0;
      const dropCls = drop <= -15 ? 'text-red-400' : drop <= -5 ? 'text-yellow-400' : 'text-green-400';

      const cycleLow = data?.cycle_low || null;
      const gain     = cycleLow ? (cp / cycleLow - 1) * 100 : null;
      const gainStr  = gain !== null ? `${gain >= 0 ? '+' : ''}${gain.toFixed(1)}%` : null;
      const gainCls  = gain !== null ? (gain >= 0 ? 'text-green-400' : 'text-red-400') : '';

      document.getElementById(`card-${ticker}`).innerHTML = `
        <div class="bg-slate-800 rounded-2xl p-5 mb-4 shadow-xl border border-slate-700/30">

          <!-- 가격 헤더 -->
          <div class="flex justify-between items-end mb-2">
            <div>
              <h3 class="text-xl font-black tracking-tight">
                ${ticker} <span class="text-sm font-normal text-slate-300">→ ${etf}</span>
              </h3>
            </div>
            <div class="text-right">
              <div class="text-2xl font-black ${dropCls}">${drop.toFixed(1)}%</div>
              <div class="text-[11px] text-slate-300">$${cp.toFixed(2)} / ATH $${ath.toFixed(2)}</div>
              <div class="text-[10px] text-slate-300">${data?.ath_updated_at ? `ATH 갱신 ${data.ath_updated_at}` : 'ATH 갱신일 없음'}</div>
            </div>
          </div>

          <!-- 사이클 저점 -->
          ${cycleLow
            ? `<div class="mb-3 text-[12px] text-slate-300">
                 저점 $${cycleLow.toFixed(2)} → <span class="${gainCls} font-bold">${gainStr}</span>
               </div>`
            : `<div class="mb-3 text-[11px] text-slate-300">사이클 없음</div>`
          }

          <!-- 분할 안내 (분할 의심 시 상태 행 대신 표시) -->
          ${splitBanner(ticker)}

          <!-- 상태 행 -->
          ${splitState(ticker) ? '' : `<div class="space-y-2">
            ${statusRow('무매', getInfiStatus(ticker, data, cp))}
            ${statusRow('매수', getBuyStatus(ticker, drop, ath, cp, prices[etf].current))}
            ${statusRow('하드', getHardStatus(ticker, drop, ath, cp, prices[etf].current))}
            ${statusRow('매도', getSellStatus(ticker, data, drop, gain, ath, cycleLow))}
          </div>`}

          <!-- 사이클 설정 토글 -->
          <button onclick="document.getElementById('edit-${ticker}').classList.toggle('hidden')"
                  class="w-full mt-4 pt-3 border-t border-slate-700/50 text-[11px] text-slate-300 flex justify-between">
            <span>CYCLE SETTINGS</span><span>▼</span>
          </button>
          <div id="edit-${ticker}" class="hidden pt-3 space-y-2">
            <!-- 무매 HAE -->
            <div class="bg-slate-900/50 p-3 rounded-xl space-y-2">
              <label class="text-[10px] text-slate-300 block">무매 HAE (매도 후 재설정)</label>
              <div class="flex gap-2">
                <input id="${ticker}-hae" type="number" step="0.01"
                       placeholder="0.00" value="${data?.infi_hae || ''}"
                       class="flex-1 bg-slate-800 rounded-lg px-3 py-2 text-sm outline-none border border-slate-700 focus:border-yellow-500">
                <button onclick="saveHae('${ticker}')"
                        class="px-4 py-2 bg-yellow-600 hover:bg-yellow-500 rounded-lg text-sm font-bold transition-all active:scale-95">
                  저장
                </button>
              </div>
            </div>
            <!-- 사이클 저점 -->
            <div class="bg-slate-900/50 p-3 rounded-xl space-y-2">
              <label class="text-[10px] text-slate-300 block">사이클 저점 입력</label>
              <input id="${ticker}-cycle-low" type="number" step="0.01"
                     placeholder="0.00" value="${cycleLow || ''}"
                     class="w-full bg-slate-800 rounded-lg px-3 py-2 text-sm outline-none border border-slate-700 focus:border-emerald-500">
              <div class="flex gap-2">
                <button onclick="startCycle('${ticker}')"
                        class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-sm font-bold transition-all active:scale-95">
                  🚀 사이클 시작
                </button>
                <button onclick="endCycle('${ticker}')"
                        class="flex-1 py-2 bg-red-600/80 hover:bg-red-500 rounded-lg text-sm font-bold transition-all active:scale-95">
                  ⏹ 사이클 종료
                </button>
              </div>
              ${cycleLow ? `<p class="text-[10px] text-slate-300">현재 저점: $${cycleLow.toFixed(2)} · 종료 후 재시작하면 상태 초기화</p>` : ''}
            </div>
          </div>

        </div>`;
    }

    function renderAll() { renderCard('QQQ'); renderCard('SOXX'); }

    // ── 이벤트 핸들러 ──────────────────────────────────────────────

    function toggleSettings() {
      const p = document.getElementById('settings-panel');
      p.classList.toggle('hidden');
      if (!p.classList.contains('hidden')) {
        const c = getConfig();
        document.getElementById('inp-gist-id').value = c.gistId;
        document.getElementById('inp-token').value   = c.token;
        document.getElementById('inp-finnhub').value = c.finnhub;
      }
    }

    function saveSettings() {
      localStorage.setItem('gist_id',       document.getElementById('inp-gist-id').value.trim());
      localStorage.setItem('gist_token',    document.getElementById('inp-token').value.trim());
      localStorage.setItem('finnhub_token', document.getElementById('inp-finnhub').value.trim());
      toggleSettings();
      init();
    }

    function applyManual() {
      ['QQQ', 'SOXX'].forEach(t => {
        const cp = parseFloat(document.getElementById(`m-${t.toLowerCase()}-p`).value);
        if (cp > 0) {
          prices[t].current = cp;
          if (!prices[t].ath || prices[t].ath <= 0) prices[t].ath = cp;
        }
      });
      renderAll();
      setStatus('수동 가격 적용됨 · ' + now());
      document.getElementById('settings-panel').classList.add('hidden');
    }

    async function saveHae(ticker) {
      const val = parseFloat(document.getElementById(`${ticker}-hae`).value);
      if (!val || val <= 0) { alert('HAE 가격을 입력해주세요'); return; }
      if (!stockData) stockData = {};
      if (!stockData[ticker]) stockData[ticker] = {};
      stockData[ticker].infi_hae = val;
      const ok = await saveToGist();
      renderAll();
      setStatus(ok ? `✅ ${ticker} HAE 저장 · ${now()}` : `❌ 저장 실패`);
    }

    // 분할 보정: 저장된 절대가를 비율로 나눈다 (사용자가 버튼으로 확정할 때만 실행)
    async function applySplit(ticker) {
      const st = splitState(ticker);
      if (!st || st.kind !== 'pending') return;
      const ratio = parseFloat(document.getElementById(`split-ratio-${ticker}`).value);
      if (!(ratio > 0) || !isFinite(ratio)) { alert('분할 비율을 입력해주세요'); return; }
      const d = stockData?.[ticker] || {};
      const fields = Object.keys(SPLIT_FIELDS).filter(k => d[k] > 0);
      const preview = fields.map(k => `${SPLIT_FIELDS[k]}: $${d[k].toFixed(2)} → $${(d[k] / ratio).toFixed(2)}`).join('\n') || '(보정할 저장값 없음)';
      const extra = ticker === 'SOXX' ? '\n매도 연속 카운트(soxx_consecutive)는 0으로 초기화됩니다.' : '';
      if (!confirm(`${ticker} 분할 보정을 적용합니다 (÷${ratio}).\n\n${preview}${extra}\n\n진행할까요?`)) return;
      if (!stockData) stockData = {};
      if (!stockData[ticker]) stockData[ticker] = {};
      const t = stockData[ticker];
      fields.forEach(k => { t[k] = Number((t[k] / ratio).toFixed(4)); });
      if (ticker === 'SOXX') t.soxx_consecutive = 0;
      t.split_checked = st.info.date;
      t.pending_split = null;
      const ok = await saveToGist();
      renderAll();
      setStatus(ok ? `✅ ${ticker} 분할 보정 적용 (÷${ratio}) · ${now()}` : `❌ 저장 실패`);
    }

    // '분할 아님' — 저장값은 건드리지 않고 이 불연속을 무시한다
    async function dismissSplit(ticker) {
      const st = splitState(ticker);
      if (!st || st.kind !== 'pending') return;
      if (!confirm(`${ticker} 가격 불연속(${st.info.date})을 분할이 아닌 것으로 처리합니다.\n저장값은 바뀌지 않습니다. 진행할까요?`)) return;
      if (!stockData) stockData = {};
      if (!stockData[ticker]) stockData[ticker] = {};
      const t = stockData[ticker];
      t.split_checked   = st.info.date;
      t.split_dismissed = st.info.date;
      t.pending_split   = null;
      const ok = await saveToGist();
      renderAll();
      setStatus(ok ? `✅ ${ticker} 분할 의심 해제 · ${now()}` : `❌ 저장 실패`);
    }

    async function startCycle(ticker) {
      const val = parseFloat(document.getElementById(`${ticker}-cycle-low`).value);
      if (!val || val <= 0) { alert('저점 가격을 입력해주세요'); return; }
      if (!stockData) stockData = {};
      const prev = stockData[ticker] || {};
      stockData[ticker] = {
        infi_hae:         prev.infi_hae || null,
        sell_ath:         prev.sell_ath  || null,
        cycle_low:        val,
        sell_unlocked:    false,
        sell_1st_done:    false,
        sell_2nd_done:    false,
        soxx_consecutive: 0,
        soxx_last_date:   null,
        pending_split:    prev.pending_split   || null,
        split_checked:    prev.split_checked   || null,
        split_dismissed:  prev.split_dismissed || null
      };
      const ok = await saveToGist();
      renderAll();
      if (ok) launchConfetti();
      setStatus(ok ? `✅ ${ticker} 사이클 시작 · ${now()}` : `❌ 저장 실패`);
    }

    async function endCycle(ticker) {
      if (!confirm(`${ticker} 사이클을 종료하시겠습니까?`)) return;
      if (!stockData) stockData = {};
      const prev = stockData[ticker] || {};
      stockData[ticker] = {
        cycle_low: null,
        infi_hae:  prev.infi_hae || null,
        sell_ath:  prev.sell_ath  || null,
        pending_split:   prev.pending_split   || null,
        split_checked:   prev.split_checked   || null,
        split_dismissed: prev.split_dismissed || null
      };
      const ok = await saveToGist();
      renderAll();
      setStatus(ok ? `✅ ${ticker} 사이클 종료 · ${now()}` : `❌ 저장 실패`);
    }

    // ── 진입점 ─────────────────────────────────────────────────────

    function launchConfetti() {
      const end    = Date.now() + 1500;
      const colors = ['#10b981', '#3b82f6', '#f59e0b'];
      (function frame() {
        confetti({ particleCount: 3, angle: 60,  spread: 55, origin: { x: 0 }, colors });
        confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 }, colors });
        if (Date.now() < end) requestAnimationFrame(frame);
      }());
    }

    async function updateSellAth() {
      if (!stockData) return false;
      let changed = false;
      const today = new Date().toISOString().split('T')[0];
      for (const ticker of ['QQQ', 'SOXX']) {
        const cp = prices[ticker].current;
        if (!cp || cp <= 0) continue;
        const t = stockData[ticker];
        if (!t) continue;
        if (splitState(ticker)) continue;   // 분할 보정 대기 중에는 ATH 자동 갱신 보류
        const sellAth = t.sell_ath || 0;
        if (cp > sellAth) {
          t.sell_ath = cp;
          t.ath_updated_at = today;
          changed = true;
        }
      }
      if (changed) await saveToGist();
      return changed;
    }

    async function refreshAll() {
      setStatus('데이터 동기화 중...');
      await fetchGistData();
      const [q, s, sl, tq] = await Promise.all([fetchPrice('QQQ'), fetchPrice('SOXX'), fetchPrice('SOXL'), fetchPrice('TQQQ')]);
      if (q)  prices.QQQ  = q;
      if (s)  prices.SOXX = s;
      if (sl) prices.SOXL = sl;
      if (tq) prices.TQQQ = tq;
      await updateSellAth();
      const updatedConsec = await updateSoxxCount();
      renderAll();
      setStatus(updatedConsec !== null
        ? `✅ 업데이트 완료 · SOXX ${updatedConsec}/5 · ${now()}`
        : `✅ 업데이트 완료 · ${now()}`
      );
    }

    async function init() {
      const c = getConfig();
      if (!c.gistId || !c.token) {
        setStatus('⚙️ Gist 설정을 완료해주세요.');
        toggleSettings();
        return;
      }
      await refreshAll();
    }
    init();
  </script>
</body>
</html>
